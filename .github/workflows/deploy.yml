name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Clear stale Pages deployment
        if: ${{ contains(github.event.head_commit.message, 'Clear stale Pages deployment') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = '613e211bd5bf628898a38635ce1dccf8b2205745'
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: deployment,
              })
              core.info(`Canceled stale Pages deployment ${deployment}`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(`Stale Pages deployment ${deployment} is already gone`)
            }
      - name: Inspect Pages source
        if: ${{ contains(github.event.head_commit.message, 'Inspect Pages source') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.request('GET /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            core.info(JSON.stringify({
              status: response.data.status,
              build_type: response.data.build_type,
              source: response.data.source,
              html_url: response.data.html_url,
            }))
      - name: Repair Pages site metadata
        if: ${{ contains(github.event.head_commit.message, 'Repair Pages site') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              data: {
                build_type: 'workflow',
                source: { branch: 'master', path: '/' },
              },
            })
            core.info(`Pages site metadata reset: HTTP ${response.status}`)
      - uses: actions/deploy-pages@v4
        id: deployment
        if: ${{ !contains(github.event.head_commit.message, 'Inspect Pages source') && !contains(github.event.head_commit.message, 'Repair Pages site') }}
